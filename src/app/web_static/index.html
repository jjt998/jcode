<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JCode Web</title>
    <link rel="stylesheet" href="/static/style.css?v=20260903-model-controls" />
  </head>
  <body>
    <div class="shell">
      <aside class="sessions" aria-label="Sessions">
        <div class="brand">
          <div>
            <p class="eyebrow">local projects</p>
            <h1>JCode</h1>
          </div>
          <button class="icon-button" id="refreshAll" title="刷新" aria-label="刷新">↻</button>
        </div>
        <form class="project-form" id="projectForm">
          <input id="projectPath" placeholder="仓库路径" />
          <input id="projectName" placeholder="项目名，可选" />
          <button type="submit">创建项目</button>
        </form>
        <div class="project-list" id="projectList"></div>
        <div class="divider"></div>
        <button class="new-session" id="newSession">在项目中新建会话</button>
        <div class="session-list" id="sessionList"></div>
      </aside>

      <main class="conversation" aria-label="Conversation">
        <header class="topbar">
          <div>
            <p class="eyebrow">workspace</p>
            <h2 id="sessionTitle">选择会话</h2>
            <span id="projectRoot"></span>
          </div>
          <div class="run-state" id="runState">idle</div>
        </header>

        <section class="messages" id="turnList" aria-live="polite"></section>

        <form class="composer" id="composer">
          <textarea id="messageInput" rows="3" placeholder="给 JCode 一个任务"></textarea>
          <div class="composer-actions">
            <div class="model-controls" aria-label="模型设置">
              <label class="control-field">
                <span>模型</span>
                <select id="modelProfile" aria-label="模型"></select>
              </label>
              <label class="control-field">
                <span>思考强度</span>
                <select id="reasoningEffort" aria-label="思考强度"></select>
              </label>
              <span id="reasoningSupport" class="reasoning-support"></span>
            </div>
            <button type="button" class="secondary" id="stopRun">停止</button>
            <button type="submit" id="sendMessage">发送</button>
          </div>
        </form>
      </main>
    </div>

    <script src="/static/app.js?v=20260903-model-controls"></script>
  </body>
</html>
