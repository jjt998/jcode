<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JCode Web</title>
    <link rel="stylesheet" href="/static/style.css?v=20260904-tool-artifact" />
  </head>
  <body>
    <div class="shell">
      <aside class="sessions" aria-label="Sessions">
        <div class="brand">
          <div>
            <h1>JCode</h1>
            <p class="brand-subtitle">本地编程工作台</p>
          </div>
          <button class="icon-button" id="refreshAll" title="刷新" aria-label="刷新">↻</button>
        </div>
        <form class="project-form" id="projectForm">
          <label for="projectPath">添加项目</label>
          <input id="projectPath" placeholder="仓库路径" aria-label="仓库路径" />
          <input id="projectName" placeholder="项目名，可选" aria-label="项目名，可选" />
          <button type="submit">创建项目</button>
        </form>
        <div class="project-list" id="projectList"></div>
        <div class="divider"></div>
        <button class="new-session" id="newSession">在项目中新建会话</button>
        <button class="session-toggle" id="sessionToggle" type="button" aria-expanded="false" aria-controls="sessionPanel">历史会话 <span class="toggle-mark" aria-hidden="true">+</span></button>
        <div class="session-panel" id="sessionPanel" hidden>
          <div class="session-list" id="sessionList"></div>
        </div>
      </aside>
      <div class="sidebar-resizer" id="sidebarResizer" role="separator" tabindex="0" aria-label="调整侧栏宽度" aria-orientation="vertical"></div>

      <main class="conversation" aria-label="Conversation">
        <header class="topbar">
          <div>
            <h2 id="sessionTitle">选择会话</h2>
            <span class="context-label">当前工作区</span>
            <span id="projectRoot"></span>
          </div>
          <div class="run-state" id="runState" role="status" aria-live="polite">空闲</div>
        </header>
        <div class="horizontal-resizer" id="topbarResizer" role="separator" tabindex="0" aria-label="调整标题区高度" aria-orientation="horizontal"></div>

        <section class="messages" id="turnList" aria-live="polite">
          <button type="button" class="jump-latest" id="jumpLatest" aria-label="跳转到最新内容" title="跳转到最新内容" hidden>
            <span aria-hidden="true">↓</span>
          </button>
        </section>

        <div class="horizontal-resizer" id="composerResizer" role="separator" tabindex="0" aria-label="调整输入区高度" aria-orientation="horizontal"></div>

        <form class="composer" id="composer">
          <label class="composer-label" for="messageInput">下一项任务</label>
          <textarea id="messageInput" rows="3" placeholder="描述你想完成的工作…"></textarea>
          <div class="composer-actions">
            <div class="model-controls" aria-label="模型设置">
              <label class="control-field">
                <span>模型</span>
                <select id="modelProfile" aria-label="模型"></select>
              </label>
              <label class="control-field reasoning-toggle" id="reasoningToggleField">
                <span>推理</span>
                <input id="thinkingEnabled" type="checkbox" aria-label="开启推理">
              </label>
              <label class="control-field">
                <span>思考强度</span>
                <select id="reasoningEffort" aria-label="思考强度"></select>
              </label>
              <span id="reasoningSupport" class="reasoning-support"></span>
            </div>
            <button type="button" class="secondary" id="stopRun">停止</button>
            <button type="submit" id="sendMessage">发送</button>
          </div>
        </form>
      </main>
    </div>

    <script src="/static/app.js?v=20260910-empty-session-models"></script>
  </body>
</html>
